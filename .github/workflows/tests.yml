# Runs the tests that only need the pokecrystal *source* -- names, move data,
# map connections, warps, trainers, and the checkpoint timeline logic.
#
# The rest of the suite drives a real emulator, which needs a ROM built from the
# disassembly. That is not distributed, so those tests run locally: see the
# README. Naming this job for what it actually covers keeps the badge honest.
name: data-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  data-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The README badge claims 3.11+, so 3.11 is tested rather than assumed.
      # It was an unbacked claim: nothing declared a minimum -- no
      # python_requires, no requires-python -- and CI only ever ran 3.12, so the
      # badge was the single place that number appeared.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pokecrystal disassembly
        run: git clone --depth 1 https://github.com/pret/pokecrystal.git "$HOME/pokecrystal"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        # The rule set and every suppression are in ruff.toml, with reasons.
        # Before this, eight `# noqa: BLE001` comments were addressed to a
        # linter that had never been configured -- and seven other blind
        # excepts in the same files carried no comment at all.
        run: ruff check pilot tests

      - name: Run the data tests
        env:
          POKECRYSTAL_DIR: /home/runner/pokecrystal
        # No filter: tests that need a ROM skip themselves, which is sturdier
        # than a name pattern (an earlier "gamedata|world|timeline" filter also
        # matched a navigation test called "reaches a live overworld").
        run: python -m tests
