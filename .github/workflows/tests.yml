# Runs the tests that only need the pokecrystal *source* -- names, move data,
# map connections, warps, trainers, and the checkpoint timeline logic.
#
# The rest of the suite drives a real emulator, which needs a ROM built from the
# disassembly. That is not distributed, so those tests run locally: see the
# README. Naming this job for what it actually covers keeps the badge honest.
name: data-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pokecrystal disassembly
        run: git clone --depth 1 https://github.com/pret/pokecrystal.git "$HOME/pokecrystal"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the data tests
        env:
          POKECRYSTAL_DIR: /home/runner/pokecrystal
        run: python -m tests -k "gamedata|world|timeline"
